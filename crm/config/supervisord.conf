[program:crm-email-worker]
command=/usr/bin/php /Applications/MAMP/htdocs/PP/webitech/WEB/crm/workers/email-sync-worker.php
directory=/Applications/MAMP/htdocs/PP/webitech/WEB/crm
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/Applications/MAMP/htdocs/PP/webitech/WEB/crm/logs/worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=30
stopsignal=TERM
numprocs=2
process_name=%(program_name)s_%(process_num)02d

[group:crm-workers]
programs=crm-email-worker
priority=999
