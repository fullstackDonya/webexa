# Nginx configuration for webexa.fr (PHP)
# File: /etc/nginx/sites-available/webexa.fr

server {
    listen 80;
    listen [::]:80;
    server_name webexa.fr www.webexa.fr;

    root /var/www/webexa;
    index index.php index.html index.htm;

    # Logs
    access_log /var/log/nginx/webexa.fr.access.log combined;
    error_log /var/log/nginx/webexa.fr.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to composer files
    location ~ ^/(composer\.(json|lock)|\.env|\.env\.|vendor/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache static files (30 days)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP FPM handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 75s;
        
        # Additional PHP security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # URL rewriting
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limiting for login
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    location ~ ^/(login|register|authenticate)\.php$ {
        limit_req zone=login burst=10 nodelay;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
