# Nginx configuration for webexa.online (Python FastAPI)
# File: /etc/nginx/sites-available/webexa.online

server {
    listen 80;
    listen [::]:80;
    server_name webexa.online www.webexa.online;

    # Logs
    access_log /var/log/nginx/webexa.online.access.log combined;
    error_log /var/log/nginx/webexa.online.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy settings for FastAPI/Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static API responses (optional)
    location ~* ^/api/.*\.(json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache_valid 200 10m;
        expires 10m;
        add_header Cache-Control "public";
    }

    # Deny access to environment files and sensitive paths
    location ~ /\.(env|git|) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(venv|\.env|requirements\.txt|\.py|__pycache__) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
